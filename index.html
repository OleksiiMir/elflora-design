<style>
:root { --ink: #231c1e; --muted: #6a5f61; --bar: rgba(255,255,255,.86); --line: rgba(35,28,30,.12); --accent: #7a1b2b; --stage: #ece7e5; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: "Manrope", "Segoe UI", system-ui, sans-serif; background: var(--stage); color: var(--ink); padding-top: calc(72px + env(safe-area-inset-top, 0px)); }
[hidden] { display: none !important; }
.switch { position: fixed; z-index: 100; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 999px; background: var(--bar); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 8px 28px rgba(35,28,30,.16), 0 0 0 1px var(--line); max-width: calc(100vw - 24px); }
.group { display: flex; gap: 2px; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
.switch button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.switch button:hover { color: var(--ink); }
.switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.switch button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.dot { width: 14px; height: 14px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); flex: none; }
.ic { width: 18px; height: 18px; }
.stage { display: flex; justify-content: center; padding-bottom: 40px; }
.view { background: #fff; box-shadow: 0 10px 40px rgba(35,28,30,.12); }
.view.mob { width: 390px; border-radius: 28px; overflow: clip; }
.sc-a a { color: #2b1f22; } .sc-b a { color: #e8d9bf; } .sc-c a { color: #16110f; }
.view button { color: inherit; }
@media (max-width: 640px) {
  body { padding-top: calc(64px + env(safe-area-inset-top, 0px)); }
  .switch { gap: 2px; padding: 4px; }
  .switch button { height: 36px; padding: 0 11px; font-size: 13px; }
  .switch .name, .switch .devname { display: none; }
  .stage { padding-bottom: 0; }
  .view.mob { width: 100%; border-radius: 0; box-shadow: none; }
}
</style>
</head>

<script>
(function () {
  var stage = document.getElementById('stage');
  var state = { k: 'a', v: window.innerWidth < 700 ? 'mob' : 'desk' };
  try { var h = location.hash.slice(1).split('-'); if (/^[abc]$/.test(h[0])) state.k = h[0]; if (h[1] === 'desk' || h[1] === 'mob') state.v = h[1]; } catch (e) {}
  function fit() {
    var el = stage.firstElementChild; if (!el) return;
    el.style.zoom = state.v === 'desk' ? Math.min(1, (document.documentElement.clientWidth) / 1440) : 1;
  }
  function render() {
    var t = document.getElementById(state.v + '-' + state.k);
    var wrap = document.createElement('div');
    wrap.className = 'view sc-' + state.k + (state.v === 'mob' ? ' mob' : '');
    wrap.style.width = state.v === 'desk' ? '1440px' : '';
    wrap.appendChild(t.content.cloneNode(true));
    stage.innerHTML = ''; stage.appendChild(wrap);
    document.querySelectorAll('.switch [data-k]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.k === state.k)); });
    document.querySelectorAll('.switch [data-v]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === state.v)); });
    try { history.replaceState(null, '', '#' + state.k + '-' + state.v); } catch (e) {}
    fit(); window.scrollTo(0, 0);
  }
  document.querySelectorAll('.switch [data-k]').forEach(function (b) { b.addEventListener('click', function () { state.k = b.dataset.k; render(); }); });
  document.querySelectorAll('.switch [data-v]').forEach(function (b) { b.addEventListener('click', function () { state.v = b.dataset.v; render(); }); });
  // Посилання в макетах — демонстраційні.
  stage.addEventListener('click', function (e) { var a = e.target.closest('a'); if (a && a.getAttribute('href') === '#') e.preventDefault(); });
  window.addEventListener('resize', fit);
  render();
})();
</script>
